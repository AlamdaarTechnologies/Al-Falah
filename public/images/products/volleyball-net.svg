<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="vbSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="sandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d089"/>
      <stop offset="100%" stop-color="#dfb15b"/>
    </linearGradient>
    <pattern id="vbMesh" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 0 8 L 16 8 M 8 0 L 8 16" fill="none" stroke="#1e293b" stroke-width="1.5" opacity="0.8"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" rx="20" fill="url(#vbSky)"/>
  
  <!-- Beach Sand / Arena Ground -->
  <polygon points="100,500 700,500 600,270 200,270" fill="url(#sandGrad)"/>
  <!-- Court Boundary Lines -->
  <polygon points="140,500 660,500 570,270 230,270" fill="none" stroke="#2563eb" stroke-width="5" opacity="0.85"/>
  <line x1="400" y1="270" x2="400" y2="500" stroke="#2563eb" stroke-width="4" opacity="0.85"/>

  <!-- High Volleyball Posts -->
  <line x1="150" y1="130" x2="150" y2="390" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
  <line x1="650" y1="130" x2="650" y2="390" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
  <!-- Tension Guy Wires -->
  <line x1="150" y1="160" x2="60" y2="400" stroke="#64748b" stroke-width="3"/>
  <line x1="650" y1="160" x2="740" y2="400" stroke="#64748b" stroke-width="3"/>

  <!-- Top Horizontal Band (Canvas) -->
  <rect x="150" y="175" width="500" height="18" fill="#ffffff" stroke="#94a3b8" stroke-width="1" rx="2"/>
  <line x1="150" y1="184" x2="650" y2="184" stroke="#e11d48" stroke-width="4"/>

  <!-- Volleyball Net Mesh -->
  <rect x="150" y="193" width="500" height="110" fill="#f8fafc" opacity="0.3"/>
  <rect x="150" y="193" width="500" height="110" fill="url(#vbMesh)"/>
  
  <!-- Bottom Band -->
  <rect x="150" y="303" width="500" height="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>

  <!-- Antennae (Red & White Striped Poles at Sides) -->
  <g transform="translate(230, 130)">
    <line x1="0" y1="0" x2="0" y2="180" stroke="#dc2626" stroke-width="4"/>
    <line x1="0" y1="20" x2="0" y2="40" stroke="#ffffff" stroke-width="4"/>
    <line x1="0" y1="60" x2="0" y2="80" stroke="#ffffff" stroke-width="4"/>
    <line x1="0" y1="100" x2="0" y2="120" stroke="#ffffff" stroke-width="4"/>
    <line x1="0" y1="140" x2="0" y2="160" stroke="#ffffff" stroke-width="4"/>
  </g>
  <g transform="translate(570, 130)">
    <line x1="0" y1="0" x2="0" y2="180" stroke="#dc2626" stroke-width="4"/>
    <line x1="0" y1="20" x2="0" y2="40" stroke="#ffffff" stroke-width="4"/>
    <line x1="0" y1="60" x2="0" y2="80" stroke="#ffffff" stroke-width="4"/>
    <line x1="0" y1="100" x2="0" y2="120" stroke="#ffffff" stroke-width="4"/>
    <line x1="0" y1="140" x2="0" y2="160" stroke="#ffffff" stroke-width="4"/>
  </g>

  <!-- Tricolor Volleyball -->
  <g transform="translate(400, 360)">
    <circle cx="0" cy="0" r="28" fill="#facc15" stroke="#1e293b" stroke-width="2"/>
    <!-- Curved Panels -->
    <path d="M -26,-10 C -10,-10 10,-24 20,-20 C 10,-6 -10,0 -20,20" fill="#2563eb" stroke="#1e293b" stroke-width="1.5"/>
    <path d="M -15,24 C 0,15 15,10 26,10 C 15,22 0,26 -5,27" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
    <path d="M -5,-27 C 12,-18 20,0 12,25 C -5,20 -15,5 -10,-22" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  </g>

  <!-- Top Banner Tag -->
  <rect x="30" y="30" width="190" height="40" rx="10" fill="#1e3a8a" opacity="0.9"/>
  <text x="125" y="56" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="1">VOLLEYBALL NET</text>
</svg>
