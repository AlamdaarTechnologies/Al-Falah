<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="badmSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f7fa"/>
      <stop offset="100%" stop-color="#e0eef5"/>
    </linearGradient>
    <linearGradient id="courtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#083344"/>
    </linearGradient>
    <pattern id="badmMesh" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 0 5 L 10 5 M 5 0 L 5 10" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" rx="20" fill="url(#badmSky)"/>
  
  <!-- Badminton Court Floor -->
  <polygon points="120,500 680,500 580,260 220,260" fill="url(#courtGrad)"/>
  <!-- Court Markings -->
  <polygon points="170,500 630,500 550,260 250,260" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.85"/>
  <line x1="400" y1="260" x2="400" y2="500" stroke="#ffffff" stroke-width="3" opacity="0.85"/>
  <line x1="200" y1="340" x2="600" y2="340" stroke="#ffffff" stroke-width="3" opacity="0.85"/>
  <line x1="150" y1="440" x2="650" y2="440" stroke="#ffffff" stroke-width="3" opacity="0.85"/>

  <!-- Net Posts -->
  <line x1="160" y1="180" x2="160" y2="370" stroke="#1e293b" stroke-width="10" stroke-linecap="round"/>
  <line x1="640" y1="180" x2="640" y2="370" stroke="#1e293b" stroke-width="10" stroke-linecap="round"/>
  <!-- Post Base Caps -->
  <ellipse cx="160" cy="370" rx="14" ry="6" fill="#0f172a"/>
  <ellipse cx="640" cy="370" rx="14" ry="6" fill="#0f172a"/>

  <!-- Net Headband (White Vinyl Top Band) -->
  <rect x="160" y="190" width="480" height="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="2"/>

  <!-- Badminton Net Mesh -->
  <rect x="160" y="202" width="480" height="85" fill="#475569" opacity="0.85"/>
  <rect x="160" y="202" width="480" height="85" fill="url(#badmMesh)"/>
  
  <!-- Net Bottom Cord -->
  <line x1="160" y1="287" x2="640" y2="287" stroke="#ffffff" stroke-width="3" opacity="0.9"/>

  <!-- Shuttlecock Flying in Air -->
  <g transform="translate(340, 140) rotate(35)">
    <!-- Feathers -->
    <polygon points="0,0 -16,-35 16,-35" fill="#ffffff" opacity="0.95" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="-10" y1="-22" x2="10" y2="-22" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="-14" y1="-30" x2="14" y2="-30" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Cork Base -->
    <path d="M -7,0 A 7,7 0 0,0 7,0 Z" fill="#d97706"/>
    <!-- Cork Tape -->
    <rect x="-7" y="-3" width="14" height="3" fill="#b91c1c"/>
  </g>

  <!-- Top Banner Tag -->
  <rect x="30" y="30" width="190" height="40" rx="10" fill="#0e7490" opacity="0.9"/>
  <text x="125" y="56" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="1">BADMINTON NET</text>
</svg>
